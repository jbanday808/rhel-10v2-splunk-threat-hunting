name: Validate project
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source files
        run: python3 scripts/validate_project.py
      - name: Test redaction and configuration merging
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse and check Windows files
        shell: pwsh
        run: ./scripts/windows/Test-Project.ps1
