# Proposed inputs only; NOT installed or deployed by GitHub.
# Monitor sanitized newline JSON (NOT PCAPs, payloads, or credentials).
[monitor:///var/log/siem-sensor/zeek/*.log]
disabled = 0
index = net_zeek
sourcetype = zeek:json

[monitor:///var/log/siem-sensor/suricata/eve.json]
disabled = 0
index = net_suricata
sourcetype = suricata:eve

[monitor:///var/log/siem-sensor/yara/*.json]
disabled = 1
index = net_yara
sourcetype = yara:json
