if ($syslogfacility-text == "auth" or $syslogfacility-text == "authpriv" or $programname == "siem-lab") then {
    action(type="omfile"
        file="/var/log/siem-lab/linux.log"
        fileOwner="root"
        fileGroup="splunk"
        fileCreateMode="0640"
        template="RSYSLOG_TraditionalFileFormat")
}
